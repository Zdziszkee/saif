name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    container: oven/bun:1.4.2-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun test

  verify:
    name: verify
    runs-on: ubuntu-latest
    container: oven/bun:1.4.2-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and lint
        run: bun run verify
